name: CI

# Gate every change on the exact checks that were previously only run by hand:
# type-check, production build, and the unit-test suite. No secrets required —
# the app is a client SPA, so `vite build` bundles fine without runtime env.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Type-debt ratchet (strict errors + `as any` must not grow)
        run: node scripts/type-debt.mjs
      - name: Style guard (no literal brand colors)
        run: node scripts/style-guard.mjs

      - name: Unit tests + coverage ratchet (thresholds in vitest.config.ts)
        run: npx vitest run --coverage

      - name: Production build
        run: npm run build
