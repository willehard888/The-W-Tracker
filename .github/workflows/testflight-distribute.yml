name: TestFlight external distribution

# Xcode Cloud uploads every push's build to TestFlight but only the INTERNAL
# group receives it automatically. This job closes the gap: it waits for the
# push's build to finish processing, then assigns it to the external
# "The W Group" via the App Store Connect API — Apple then notifies the
# external testers. Repo-side automation because XC post-actions live only
# in the ASC UI and kept silently unconfigured.
# PAUSED 2026-09-23: Apple's individual → organization migration (team
# TY6T95YVU9) has removed Xcode Cloud since 2026-09-20, so no push produces a
# build and every run waited 45 minutes for one and failed. Manual runs only
# until the team is back; then restore the `push: branches: [main]` trigger.
on:
  workflow_dispatch:

# One distribution at a time; a newer push supersedes a waiting one.
concurrency:
  group: testflight-distribute
  cancel-in-progress: true

jobs:
  distribute:
    name: Wait for build · assign to external group
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Distribute newest build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: node scripts/testflight-distribute.mjs
