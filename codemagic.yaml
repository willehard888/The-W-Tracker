# Codemagic CI/CD config — iOS build pipeline
#
# NOTE 2026-08-20 (retriggered 2026-08-21; App Store workflow enabled by
# the founder the same day): push triggers arrive via a plain repo webhook
# (https://api.codemagic.io/hooks/<app-id>). It silently vanished once and
# builds just stopped appearing — if that happens again, check
# `gh api repos/<owner>/<repo>/hooks` first and re-create the hook.
#
# Replaces Xcode Cloud for the W Tracker iOS build. Xcode Cloud's
# scheduler aggressively parallelises pod target builds and ignores
# PBXTargetDependency for Swift module resolution — that broke every
# build from 778 onwards with "no such module 'Capacitor'" on
# whichever plugin happened to start first. We tried 12 different
# workarounds (modular_headers, @import patches, static linkage,
# pre-built mirror, SWIFT_USE_INTEGRATED_DRIVER=NO …). None solved
# it because Xcode Cloud refuses to honour `xcodebuild -jobs 1` from
# CI config.
#
# Codemagic exposes the full xcodebuild command line — we can pass
# -jobs 1 directly and force serial target builds. Slower (≈ +1 min
# per archive) but DETERMINISTIC.

workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # Configure in Codemagic dashboard → Applications → The-W-Tracker →
      # Environment variables → add to group "w":
      #   CERTIFICATE_PRIVATE_KEY  (encrypted, .pem private key contents)
      #   APP_STORE_APP_ID         (not encrypted, e.g. 6761115803)
      # The App Store Connect API key itself lives in the
      # `integrations: app_store_connect: codemagic` integration below.
      groups:
        - w
      vars:
        BUNDLE_ID: "app.lovable.wtracker"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      xcode: 26.5
      cocoapods: 1.16.2
      # Capacitor 8.x CLI requires Node ≥ 22 (build #1 on Codemagic
      # failed at the `cap copy` step with "[fatal] The Capacitor CLI
      # requires NodeJS >=22.0.0" when Node 20 was used).
      node: 22

    # Skip iOS builds for pushes that can't change the shipped app: backend
    # (edge functions/migrations run server-side), CI config, docs, tests.
    # Saves build minutes and keeps every TestFlight build meaningful.
    when:
      changeset:
        excludes:
          - "supabase/**"
          - ".github/**"
          - "**/*.md"
          - "src/**/__tests__/**"
          - "scripts/obsidian/**"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      # Rapid push cadence used to queue a build per commit — only the
      # newest commit matters for TestFlight, so cancel stale ones.
      cancel_previous_builds: true

    integrations:
      app_store_connect: codemagic

    scripts:
      - name: Install dependencies
        script: |
          npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Quality gates (typecheck + tests)
        script: |
          # Fail the build BEFORE the expensive archive if types or tests break,
          # so regressions (incl. an entitlement/signing mismatch surfaced at
          # type level) never reach TestFlight. Gates are IDENTICAL to GitHub
          # CI (tsc + type-debt ratchet + tests with the coverage floor) — a
          # build that reaches TestFlight has passed the exact same bar.
          # Lint is intentionally NOT gated yet — there's a large `as any`
          # backlog (see type-tightening task); add `npm run lint` once cleared.
          npx tsc --noEmit
          node scripts/type-debt.mjs
          node scripts/style-guard.mjs
          npx vitest run --coverage

      - name: Build web bundle + sync Capacitor (→ ios/App/App/public)
        script: |
          # Build the Vite web bundle into dist/ FIRST — `cap copy` copies dist/
          # into ios/App/App/public and writes config.xml. Without this, cap copy
          # has nothing to copy and the archive fails at CpResource with
          # "public / config.xml … no such file". (This `npm run build` was
          # accidentally dropped in 9f73054 when the quality-gates step replaced
          # the old "Build web bundle" step; the regression stayed hidden while
          # every build was still failing earlier at the Swift-module stage.)
          npm run build
          # `cap copy` only — `cap sync` would mutate CapApp-SPM/Package.swift
          # in CI, which historically broke the dependency graph (see
          # commit 2878ade for the full rationale).
          npx cap copy ios

      - name: Install pods
        script: |
          cd ios/App
          # Clean Pods/ on every CI run so a stale layout (e.g. left over
          # from a previous `:linkage => :static` Podfile) can never
          # poison the build. Podfile.lock is regenerated by pod install
          # when --repo-update brings the spec repos up to date.
          rm -rf Pods
          pod install --repo-update

      - name: Apply pre-xcodebuild patches (Capacitor + Xcode 26 fixes)
        script: |
          # Tell ci_pre_xcodebuild.sh where xcodebuild will write DerivedData
          # (must match the --archive-flags `-derivedDataPath build/DerivedData`
          # below). The script writes Pods/CapDepsFwks/<Target>/<Dep>.framework
          # symlinks into this tree — if the path doesn't match, plugin compiles
          # fail with "no such module 'Capacitor'" because the symlinks dangle.
          export CM_DERIVED_DATA_PATH="$(pwd)/build/DerivedData"

          # ci_pre_xcodebuild.sh is the workhorse: it applies ~10 separate
          # fixes that the Capacitor 8 + Xcode 26 + CocoaPods 1.16 combination
          # demands but ships nowhere. It exists under ios/App/ci_scripts/
          # because Xcode Cloud runs it automatically; Codemagic does not, so
          # we invoke it explicitly here.
          #
          # What it does (see the script for full rationale per section):
          #   1. Toolchain version re-verify (fail-fast on Xcode major drift)
          #   2. Source-patch CAPInstanceDescriptor.h — drop `@import Cordova`
          #      umbrella dep (THE root fix for our recurring
          #      "module 'Cordova' not found" SwiftCompile failure)
          #   3. Source-patch CAPInstanceDescriptor.m with a relative-path
          #      #import of CDVConfigParser.h
          #   4. Source-patch CAPBridgeViewController+CDVScreenOrientationDelegate.h
          #      with an inline @protocol declaration
          #   5. Build per-target CapDepsFwks/<Target>/ symlink dirs so plugin
          #      compiles get -F paths to their direct deps WITHOUT exposing
          #      their own framework (which would trigger a self-referential
          #      module loop in Xcode 26's explicit-modules build system)
          #   6. Patch every Capacitor* pod xcconfig with the right
          #      OTHER_LDFLAGS / OTHER_SWIFT_FLAGS / OTHER_CFLAGS entries
          #   7. Disable ENABLE_USER_SCRIPT_SANDBOXING on the App target
          #      (Xcode 26 default; blocks Pods-App-frameworks.sh execution)
          #   8. Strip bogus Metal.xctoolchain absolute paths
          #   9. Wrap bare `-disable-availability-checking` in `-Xfrontend`
          #  10. Set alwaysOutOfDate on [CP] Embed Pods Frameworks
          bash ios/App/ci_scripts/ci_pre_xcodebuild.sh

      - name: Set up signing
        script: |
          # Initialize a clean keychain for this build.
          keychain initialize

          # Decode the base64-encoded distribution-cert private key.
          #
          # Why base64: Codemagic's Secure variable storage mangles
          # newlines in multi-line PEM values, so the raw key arrives
          # at fetch-signing-files as a single garbled line and the
          # CLI rejects it with "Provided value '********' is not valid"
          # (build 5 confirmed). Storing the key as a single-line
          # base64 string sidesteps the newline issue entirely.
          if [ -z "$CERTIFICATE_PRIVATE_KEY_B64" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY_B64 not set." >&2
            echo "Add it to env group \"w\" in the Codemagic dashboard." >&2
            exit 1
          fi
          echo "$CERTIFICATE_PRIVATE_KEY_B64" | base64 -d > /tmp/cert_key.pem
          chmod 600 /tmp/cert_key.pem
          # Sanity-check that the decoded value is a real PEM block.
          head -1 /tmp/cert_key.pem | grep -q "BEGIN.*PRIVATE KEY" \
            || { echo "ERROR: decoded key is not PEM."; exit 1; }
          # Re-export as CERTIFICATE_PRIVATE_KEY so codemagic-cli-tools
          # picks it up via its conventional env-var name.
          export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_key.pem)"

          # Diagnostic: dump what already exists on the App Store
          # Connect side so we can see whether fetch needs to create
          # anything new.
          echo "──── Existing distribution certificates ────"
          app-store-connect list-certificates --type IOS_DISTRIBUTION || true
          echo "──── Existing bundle ids ────"
          app-store-connect list-bundle-ids --bundle-id-identifier "$BUNDLE_ID" || true
          echo "──── Existing provisioning profiles ────"
          # NOTE: `--profile-type` is not accepted by this CLI version's
          # `profiles list`; list everything for the diagnostic.
          app-store-connect profiles list || true

          # Fetch (or create on the fly) a distribution certificate and
          # an App Store provisioning profile for our bundle id.
          # --create handles missing cert + profile via the App Store
          # Connect API integration named "codemagic" (configured in
          # the Codemagic dashboard with our API key).
          # --certificate-key passes the PEM explicitly via file ref;
          # this is more reliable than env-var auto-discovery and means
          # the failure mode for a missing key is loud + early.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create \
            --verbose

          # Import any newly fetched certificates into the build keychain.
          keychain add-certificates

          # Apply the fetched provisioning profiles to the Xcode project.
          # Rewrites App.xcodeproj's signing settings so each target uses
          # the right profile name (without it, xcodebuild errors with
          # "App requires a provisioning profile").
          xcode-project use-profiles

          # Diagnostic: confirm the project now has a profile reference.
          echo "──── Final project signing settings ────"
          xcodebuild -project ios/App/App.xcodeproj \
            -showBuildSettings -target App -configuration Release 2>/dev/null \
            | grep -E 'CODE_SIGN|PROVISIONING|DEVELOPMENT_TEAM' || true

      - name: Bump CFBundleVersion above App Store Connect's latest
        script: |
          # App Store Connect requires every uploaded build to have a
          # strictly higher CFBundleVersion than the previously uploaded
          # build. The repo's pbxproj has CURRENT_PROJECT_VERSION = 1 which
          # collides with the very first archive ever submitted; the LAST
          # successfully uploaded build (under Xcode Cloud) was 780 — so we
          # need at least 781.
          #
          # Rather than hardcode an ever-climbing integer in the pbxproj,
          # query App Store Connect for the current latest build number and
          # set CURRENT_PROJECT_VERSION to latest+1. agvtool rewrites every
          # target's project.pbxproj in one shot. Idempotent across CI runs:
          # each build picks up the live ASC state.
          if [ -z "${APP_STORE_APP_ID:-}" ]; then
            echo "⚠️  APP_STORE_APP_ID not set — falling back to BUILD_NUMBER + 800"
            NEW_BUILD=$((BUILD_NUMBER + 800))
          else
            LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo "")
            if [ -z "$LATEST" ] || ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then
              echo "⚠️  Could not fetch latest build number from ASC — falling back to BUILD_NUMBER + 800"
              NEW_BUILD=$((BUILD_NUMBER + 800))
            else
              NEW_BUILD=$((LATEST + 1))
              echo "ℹ️  App Store Connect latest build: $LATEST → bumping to $NEW_BUILD"
            fi
          fi
          cd ios/App
          agvtool new-version -all "$NEW_BUILD"
          echo "✅ CFBundleVersion set to $NEW_BUILD"

      - name: xcodebuild archive (serial, -jobs 1)
        script: |
          # The single line that Xcode Cloud refused to give us:
          #   -jobs 1 forces xcodebuild to compile targets one at a
          #   time, eliminating the Swift-module race entirely.
          #
          # Codemagic injects the right CODE_SIGN_IDENTITY / PROVISIONING_PROFILE
          # build settings automatically from `use-profiles` above; we just
          # forward our jobs flag.
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-flags="-jobs 1 -derivedDataPath build/DerivedData"

    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - $HOME/Library/Logs/scan/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # No `beta_groups:` — internal team only by default. Add groups
        # here once you're ready to expand external testing:
        # beta_groups:
        #   - "Friends & Family"
      email:
        recipients:
          - rasmus.willehard@gmail.com
        notify:
          success: true
          failure: true
