    <meta name="description" content="Track your daily habits, earn XP, compete in battles, and level up your discipline. The ultimate self-improvement tracker.">
    <meta name="author" content="Whealth Factory" />

    <!-- iOS PWA / native shell -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Whealth Factory" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/app-icon.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/app-icon@2x.webp" />

    <meta name="theme-color" content="#0a0a0b" />

    <!-- Speed up first API + asset roundtrips -->
    <link rel="preconnect" href="https://gcwuvijcuzhunkcauzom.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://gcwuvijcuzhunkcauzom.supabase.co" />
    <link rel="preconnect" href="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev" crossorigin />

    <!-- NOTE: removed the eager <link rel="preload" as="image" href="/app-icon.png">
         because the file is 1.17MB and was blocking First Contentful Paint by
         ~1.6s on slow networks. The splash component lazy-loads it itself. -->

    <!-- Background that EXACTLY matches SplashScreen so there is no flash
         between native iOS splash → React splash → app shell -->
    <style>
      html, body {
        background: hsl(260 25% 4%);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #root { min-height: 100dvh; }
    </style>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Whealth Factory — Daily Discipline & XP">
    <meta property="og:description" content="Track your daily habits, earn XP, compete in battles, and level up your discipline.">
    <meta property="og:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/bb65b06b-529f-4d67-aff1-30bd9adfca64/id-preview-9117f182--63367557-2053-428a-aff3-29e365e38acb.lovable.app-1774179353929.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Whealth Factory — Daily Discipline & XP">
    <meta name="twitter:description" content="Track your daily habits, earn XP, compete in battles, and level up your discipline.">
    <meta name="twitter:image" content="https://pub-bb2e103a32db4e198524a2e9ed8f35b4.r2.dev/bb65b06b-529f-4d67-aff1-30bd9adfca64/id-preview-9117f182--63367557-2053-428a-aff3-29e365e38acb.lovable.app-1774179353929.png">
  </head>

  <body>
    <!-- Instant branded splash — pure inline HTML/CSS so the first frame is
         NEVER a black void while JS parses and the auth session resolves.
         React replaces #root's children on mount, removing this for free. -->
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse 105% 70% at 50% -12%,hsl(42 85% 56% / .07) 0%,transparent 58%),hsl(258 20% 1.8%)">
        <div style="font-family:system-ui,sans-serif;font-weight:900;font-size:34px;letter-spacing:-.02em;background:linear-gradient(135deg,hsl(42 90% 70%),hsl(42 78% 54%) 45%,hsl(30 85% 45%));-webkit-background-clip:text;background-clip:text;color:transparent">W</div>
        <div style="width:88px;height:3px;border-radius:99px;background:hsl(258 14% 11%);overflow:hidden"><div style="width:40%;height:100%;border-radius:99px;background:linear-gradient(90deg,hsl(42 78% 54%),hsl(18 95% 58%));animation:wf-load 1.1s ease-in-out infinite"></div></div>
        <style>@keyframes wf-load{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
