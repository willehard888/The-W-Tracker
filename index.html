<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <link rel="preconnect" href="https://images.weserv.nl" crossorigin />
    <link rel="dns-prefetch" href="https://images.weserv.nl" />
    <title>Whealth Factory — Daily Discipline & XP</title>
    <meta name="description" content="Track your daily habits, earn XP, compete in battles, and level up your discipline. The ultimate self-improvement tracker.">
    <meta name="author" content="Whealth Factory" />

    <!-- iOS PWA / native shell -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Whealth Factory" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/app-icon.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/app-icon@2x.webp" />

    <meta name="theme-color" content="#0a0a0b" />

    <!-- Speed up first API + asset roundtrips -->
    <link rel="preconnect" href="https://gcwuvijcuzhunkcauzom.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://gcwuvijcuzhunkcauzom.supabase.co" />

    <!-- Self-hosted brand fonts: preload the latin subsets both families use
         above the fold so text never flashes system-ui on first paint. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-var-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-var-latin.woff2" crossorigin />

    <!-- NOTE: removed the eager <link rel="preload" as="image" href="/app-icon.png">
         because the file is 1.17MB and was blocking First Contentful Paint by
         ~1.6s on slow networks. The splash component lazy-loads it itself. -->

    <!-- Background that EXACTLY matches SplashScreen so there is no flash
         between native iOS splash → React splash → app shell -->
    <style>
      html, body {
        background: hsl(258 20% 1.8%); /* exact LaunchScreen.storyboard match — dark→dark handoff */
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #root { min-height: 100dvh; }
      /* Static twin of HomeSkeleton (src/components/skeletons/PageSkeleton.tsx):
         paints Home's block geometry before any JS runs; React's first commit
         replaces it. Keep heights in sync with HomeSkeleton. */
      .boot-skel { max-width: 28rem; margin: 0 auto; padding: 12px 16px; }
      .boot-skel > div {
        box-sizing: border-box;
        border-radius: 12px;
        background: hsl(var(--card) / 0.4);
        border: 1px solid hsl(var(--border) / 0.3);
      }
    </style>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Whealth Factory — Daily Discipline & XP">
    <meta property="og:description" content="Track your daily habits, earn XP, compete in battles, and level up your discipline.">
    <!-- Share image lives in our own public Supabase bucket — the previous
         one was a Lovable-generated screenshot on infrastructure we don't
         control. 1200×630, regenerate via the brand card if it changes. -->
    <meta property="og:image" content="https://gcwuvijcuzhunkcauzom.supabase.co/storage/v1/object/public/brand/og.jpg">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Whealth Factory — Daily Discipline & XP">
    <meta name="twitter:description" content="Track your daily habits, earn XP, compete in battles, and level up your discipline.">
    <meta name="twitter:image" content="https://gcwuvijcuzhunkcauzom.supabase.co/storage/v1/object/public/brand/og.jpg">
  </head>

  <body>
    <div id="root">
      <div style="height: calc(env(safe-area-inset-top) + 44px)"></div>
      <div class="boot-skel" aria-hidden="true">
        <div style="height: 12px; width: 6rem; border-radius: 6px"></div>
        <div style="height: 28px; width: 75%; margin-top: 8px; border-radius: 8px"></div>
        <div style="height: 168px; margin-top: 16px; border-radius: 24px"></div>
        <div style="height: 56px; margin-top: 24px"></div>
        <div style="height: 56px; margin-top: 24px"></div>
        <div style="height: 82px; margin-top: 24px"></div>
        <div style="height: 64px; margin-top: 24px; width: 91.666667%"></div>
        <div style="height: 168px; margin-top: 12px"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
